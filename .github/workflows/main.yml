name: CI Grader

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    
    # 1. Serviço de banco de dados oficial rodando em background
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password_de_teste
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # 2. Sua imagem original intocada
    container:
      image: ufscar/cigrader:ubuntu-24_04
      options: --privileged
    
    env:
      PROF_GITHUB: ${{ secrets.PROF_GITHUB }}
      # 3. Apontamento para o SGBD: o host deve ser exatamente o nome do serviço ("postgres")
      PGUSER: postgres
      PGPASSWORD: password_de_teste
      PGDATABASE: testdb
      PGHOST: postgres

    steps:
      - uses: actions/checkout@v2
      
      # 4. Instalação rápida do cliente em tempo de execução
      - name: Instalar cliente do PostgreSQL
        run: apt-get update && apt-get install -y postgresql-client

      - uses: jitterbit/get-changed-files@v1
        id: files
        with:
          format: 'json'
          
      - uses: actions/github-script@0.3.0
        id: author-date
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const commit_details = await github.git.getCommit({owner: context.repo.owner, repo: context.repo.repo, commit_sha: context.sha});
            return commit_details.data.author.date
            
      # 5. Execução padrão do seu Grader
      - name: Grader
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ secrets.GITHUB_REPOSITORY }}
          GITHUB_ACTOR: ${{ secrets.GITHUB_ACTOR }}
          COMMIT_TIME: ${{ steps.author-date.outputs.result }}
          COMMIT_FILES: ${{ steps.files.outputs.all }}
        run: python3 .github/workflows/grade.py
